name: Keep Repo Active

on:
  schedule:
    # Runs every 50 days at 9:00 AM UTC (prevents GitHub from disabling scheduled workflows)
    - cron: '0 9 1 */2 *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update keep-alive timestamp
        run: |
          echo "Last keep-alive: $(date -u '+%Y-%m-%d %H:%M UTC')" > .github/keep-alive.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          git commit -m "chore: keep repo active [skip ci]" || echo "Nothing to commit"
          git push
